[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:dbus]
command=dbus-daemon --system --nofork
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/dbus.log
stderr_logfile=/var/log/supervisor/dbus_err.log

[program:xvnc]
command=Xvnc :1 -geometry 1280x800 -depth 24 -localhost no -SecurityTypes VncAuth -PasswordFile /home/user/.vnc/passwd
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/var/log/supervisor/xvnc.log
stderr_logfile=/var/log/supervisor/xvnc_err.log

[program:desktop]
command=su - user -c "DISPLAY=:1 startxfce4"
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/var/log/supervisor/desktop.log
stderr_logfile=/var/log/supervisor/desktop_err.log

[program:novnc]
command=websockify --web /usr/share/novnc %(ENV_PORT)s localhost:5901
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc_err.log
