[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=2
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:httpserver]
command=python3 -u /usr/local/bin/http-server.py
priority=10
autostart=true
autorestart=true
startsecs=1
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/httpserver.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
stderr_logfile=/var/log/supervisor/httpserver_err.log
stderr_logfile_maxbytes=2MB
stderr_logfile_backups=1

[program:dbus]
command=dbus-daemon --system --nofork
priority=15
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/dbus.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
stderr_logfile=/var/log/supervisor/dbus_err.log
stderr_logfile_maxbytes=2MB
stderr_logfile_backups=1

[program:xvnc]
command=Xvnc :1 -geometry %(ENV_RESOLUTION)s -depth %(ENV_VNC_DEPTH)s -localhost yes -SecurityTypes VncAuth -PasswordFile /home/user/.vnc/passwd -AlwaysShared -FrameRate %(ENV_VNC_FPS)s -CompareFB 2 -QualityLevel 8 -CompressionLevel 6 -MaxCutPending 256
priority=20
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/xvnc.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
stderr_logfile=/var/log/supervisor/xvnc_err.log
stderr_logfile_maxbytes=2MB
stderr_logfile_backups=1

[program:pulseaudio]
command=su - user -c "pulseaudio --daemonize=no --exit-idle-time=-1"
priority=25
autostart=true
autorestart=true
startsecs=3
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/pulseaudio.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
stderr_logfile=/var/log/supervisor/pulseaudio_err.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=1

[program:desktop]
command=su - user -c "DISPLAY=:1 startxfce4"
priority=30
autostart=true
autorestart=true
startsecs=8
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/desktop.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
stderr_logfile=/var/log/supervisor/desktop_err.log
stderr_logfile_maxbytes=2MB
stderr_logfile_backups=1

[program:code-server]
command=code-server --bind-addr 127.0.0.1:8443 --auth none --disable-telemetry --disable-update-check
priority=45
autostart=false
autorestart=false
startsecs=5
stopasgroup=true
killasgroup=true
environment=HOME="/home/user",NODE_OPTIONS="--max-old-space-size=384"
stdout_logfile=/var/log/supervisor/code-server.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
stderr_logfile=/var/log/supervisor/code-server_err.log
stderr_logfile_maxbytes=2MB
stderr_logfile_backups=1

[program:autobackup]
command=/usr/local/bin/autobackup-loop
priority=50
autostart=true
autorestart=true
startretries=3
redirect_stderr=true
stdout_logfile=/var/log/supervisor/autobackup.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
stderr_logfile=/var/log/supervisor/autobackup_err.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=1

[program:idle-monitor]
command=python3 -u /usr/local/bin/idle-monitor.py
priority=60
autostart=true
autorestart=true
startsecs=5
environment=DISPLAY=":1"
stdout_logfile=/var/log/supervisor/idle-monitor.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
stderr_logfile=/var/log/supervisor/idle-monitor_err.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=1

[program:watchdog]
command=python3 -u /usr/local/bin/resource-watchdog.py
priority=65
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/watchdog.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
stderr_logfile=/var/log/supervisor/watchdog_err.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=1

[program:tor]
command=tor -f /home/user/.config/tor/torrc
priority=70
autostart=false
autorestart=true
startsecs=10
user=user
stdout_logfile=/var/log/supervisor/tor.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
stderr_logfile=/var/log/supervisor/tor_err.log
stderr_logfile_maxbytes=2MB
stderr_logfile_backups=1

[program:privoxy]
command=privoxy --pidfile /tmp/privoxy.pid /etc/privoxy/config
priority=71
autostart=false
autorestart=true
startsecs=3
stdout_logfile=/var/log/supervisor/privoxy.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
stderr_logfile=/var/log/supervisor/privoxy_err.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=1
