[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:dbus]
command=dbus-daemon --system --nofork
priority=10
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/dbus.log
stderr_logfile=/var/log/supervisor/dbus_err.log

[program:xvnc]
command=Xvnc :1 -geometry %(ENV_RESOLUTION)s -depth %(ENV_VNC_DEPTH)s -localhost yes -SecurityTypes VncAuth -PasswordFile /home/user/.vnc/passwd -AlwaysShared
priority=20
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
environment=MALLOC_ARENA_MAX="2"
stdout_logfile=/var/log/supervisor/xvnc.log
stderr_logfile=/var/log/supervisor/xvnc_err.log

[program:desktop]
command=su - user -c "DISPLAY=:1 startxfce4"
priority=30
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
environment=MALLOC_ARENA_MAX="2"
stdout_logfile=/var/log/supervisor/desktop.log
stderr_logfile=/var/log/supervisor/desktop_err.log

[program:novnc]
command=websockify --web /usr/share/novnc --heartbeat 30 %(ENV_PORT)s localhost:5901
priority=40
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc_err.log

[program:autobackup]
command=/usr/local/bin/autobackup-loop
priority=50
autostart=true
autorestart=false
stderr_redirect=true
stdout_logfile=/var/log/supervisor/autobackup.log
stderr_logfile=/var/log/supervisor/autobackup_err.log
