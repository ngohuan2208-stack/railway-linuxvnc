[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=2
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; HTTP server first so Railway healthcheck answers immediately.
; /health reports honest component states during boot.
[program:httpserver]
command=python3 -u /usr/local/bin/http-server.py
priority=10
autostart=true
autorestart=true
startsecs=1
startretries=100
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/var/log/supervisor/httpserver.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
stderr_logfile=/var/log/supervisor/httpserver_err.log
stderr_logfile_maxbytes=2MB
stderr_logfile_backups=1

[program:dbus]
command=dbus-daemon --system --nofork
priority=15
autostart=true
autorestart=true
startretries=20
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/dbus.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
stderr_logfile=/var/log/supervisor/dbus_err.log
stderr_logfile_maxbytes=2MB
stderr_logfile_backups=1

; Xvnc runs as the desktop user (least privilege).
; run-xvnc.sh is generated by start.sh (auth depends on VNC_PASSWORD).
[program:xvnc]
command=/usr/local/bin/run-xvnc.sh
priority=20
user=user
environment=HOME="/home/user",USER="user",LOGNAME="user",DISPLAY=":1"
autostart=true
autorestart=true
startsecs=3
startretries=100
stopsignal=TERM
stopwaitsecs=10
stopasgroup=false
killasgroup=false
stdout_logfile=/var/log/supervisor/xvnc.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
stderr_logfile=/var/log/supervisor/xvnc_err.log
stderr_logfile_maxbytes=2MB
stderr_logfile_backups=1

[program:pulseaudio]
command=/usr/local/bin/pulse-maybe
priority=25
autostart=true
autorestart=false
startsecs=0
stopasgroup=true
killasgroup=true
exitcodes=0
stdout_logfile=/var/log/supervisor/pulseaudio.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
stderr_logfile=/var/log/supervisor/pulseaudio_err.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=1

; XFCE session as user with its own dbus session.
[program:desktop]
command=/bin/sh -c "exec dbus-launch --exit-with-session startxfce4"
priority=30
user=user
environment=HOME="/home/user",USER="user",LOGNAME="user",DISPLAY=":1"
autostart=true
autorestart=true
startsecs=8
startretries=200
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/desktop.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
stderr_logfile=/var/log/supervisor/desktop_err.log
stderr_logfile_maxbytes=2MB
stderr_logfile_backups=1

; Lazy-started from web UI (/api/start/code-server). autorestart=true keeps
; it alive once the user has started it. Wrapper unsets $PORT because
; code-server would otherwise bind the public HTTP port (Railway PORT).
[program:code-server]
command=/usr/local/bin/run-code-server.sh
priority=45
user=user
environment=HOME="/home/user",NODE_OPTIONS="--max-old-space-size=384"
autostart=false
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=/var/log/supervisor/code-server.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
stderr_logfile=/var/log/supervisor/code-server_err.log
stderr_logfile_maxbytes=2MB
stderr_logfile_backups=1

[program:autobackup]
command=/usr/local/bin/autobackup-loop
priority=50
autostart=true
autorestart=true
startretries=3
redirect_stderr=true
stdout_logfile=/var/log/supervisor/autobackup.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1

; Handles disabled mode internally when IDLE_TIMEOUT=0 (default, 24/7).
; Runs as root: needs supervisorctl access for opt-in suspend/resume.
[program:idle-monitor]
command=python3 -u /usr/local/bin/idle-monitor.py
priority=60
autostart=true
autorestart=true
startsecs=5
startretries=5
stdout_logfile=/var/log/supervisor/idle-monitor.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
stderr_logfile=/var/log/supervisor/idle-monitor_err.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=1

; RAM/CPU/disk guard + service revival (Xvnc/XFCE/HTTP) with backoff.
[program:watchdog]
command=python3 -u /usr/local/bin/resource-watchdog.py
priority=65
autostart=true
autorestart=true
startsecs=5
startretries=20
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/watchdog.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
stderr_logfile=/var/log/supervisor/watchdog_err.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=1

[program:tor]
command=tor -f /home/user/.config/tor/torrc
priority=70
autostart=false
autorestart=true
startsecs=10
startretries=5
user=user
environment=HOME="/home/user"
stdout_logfile=/var/log/supervisor/tor.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
stderr_logfile=/var/log/supervisor/tor_err.log
stderr_logfile_maxbytes=2MB
stderr_logfile_backups=1

[program:privoxy]
command=privoxy --pidfile /tmp/privoxy.pid /etc/privoxy/config
priority=71
autostart=false
autorestart=true
startsecs=3
startretries=5
stdout_logfile=/var/log/supervisor/privoxy.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
stderr_logfile=/var/log/supervisor/privoxy_err.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=1
