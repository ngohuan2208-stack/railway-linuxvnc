[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:dbus]
command=dbus-daemon --system --nofork
priority=10
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/dbus.log
stderr_logfile=/var/log/supervisor/dbus_err.log

[program:xvnc]
command=Xvnc :1 -geometry %(ENV_RESOLUTION)s -depth %(ENV_VNC_DEPTH)s -localhost yes -SecurityTypes VncAuth -PasswordFile /home/user/.vnc/passwd -AlwaysShared
priority=20
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
environment=MALLOC_ARENA_MAX="2"
stdout_logfile=/var/log/supervisor/xvnc.log
stderr_logfile=/var/log/supervisor/xvnc_err.log

[program:desktop]
command=su - user -c "DISPLAY=:1 startxfce4"
priority=30
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
environment=MALLOC_ARENA_MAX="2"
stdout_logfile=/var/log/supervisor/desktop.log
stderr_logfile=/var/log/supervisor/desktop_err.log

[program:florence]
command=su - user -c "DISPLAY=:1 florence --no-keyboard"
priority=35
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/var/log/supervisor/florence.log
stderr_logfile=/var/log/supervisor/florence_err.log

[program:httpserver]
command=python3 /usr/local/bin/http-server.py
priority=40
autostart=true
autorestart=true
startsecs=2
environment=MALLOC_ARENA_MAX="2"
stdout_logfile=/var/log/supervisor/httpserver.log
stderr_logfile=/var/log/supervisor/httpserver_err.log

[program:code-server]
command=code-server --bind-addr 0.0.0.0:8443 --auth none --disable-telemetry --disable-update-check
priority=45
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
environment=HOME="/home/user"
stdout_logfile=/var/log/supervisor/code-server.log
stderr_logfile=/var/log/supervisor/code-server_err.log

[program:autobackup]
command=/usr/local/bin/autobackup-loop
priority=50
autostart=true
autorestart=false
stderr_redirect=true
stdout_logfile=/var/log/supervisor/autobackup.log
stderr_logfile=/var/log/supervisor/autobackup_err.log

[program:idle-monitor]
command=python3 /usr/local/bin/idle-monitor.py
priority=60
autostart=true
autorestart=true
startsecs=5
environment=DISPLAY=":1"
stdout_logfile=/var/log/supervisor/idle-monitor.log
stderr_logfile=/var/log/supervisor/idle-monitor_err.log
